<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotel Reservation - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 400px;
        }
        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        label {
            display: block;
            color: #555;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🏨</div>
        <h1>Hotel Reservation System</h1>
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter your username" value="testuser">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" value="1234">
        <button onclick="login()">Login</button>
        <div id="message"></div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');

            try {
                const response = await fetch('http://localhost:8081/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });

                if (response.ok) {
                    const user = await response.json();
                    message.className = 'success';
                    message.textContent = '✅ Login successful! Welcome, ' + user.fullName;
                    localStorage.setItem('userId', user.userId);
                    setTimeout(() => {
                        window.location.href = 'rooms.html';
                    }, 1500);
                } else {
                    message.className = 'error';
                    message.textContent = '❌ Invalid username or password';
                }
            } catch (error) {
                message.className = 'error';
                message.textContent = '❌ Cannot connect to server. Please check if backend is running.';
            }
        }
    </script>
</body>
</html>
